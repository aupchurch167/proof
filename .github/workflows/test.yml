name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Server suite + client build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
          POSTGRES_DB: proof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proof -d proof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Disposable CI database. The `_test` suffix (and PROOF_TEST_DB) is what
      # lets cleanupTestData wipe rows — a copied prod URL will refuse (A9-05).
      DATABASE_URL: postgresql://proof:proof@localhost:5432/proof_test
      PROOF_TEST_DB: "1"
      NODE_ENV: test
      APP_URL: http://localhost:5173
      JWT_SECRET: test-jwt-secret-which-is-32-chars!!
      JWT_REFRESH_SECRET: test-refresh-secret-32-chars-ok!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Apply Prisma migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Client production build
        working-directory: client
        run: npm run build
        env:
          # Build must succeed with no Sentry DSN (A6-01).
          VITE_SENTRY_DSN: ""
